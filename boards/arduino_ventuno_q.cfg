# Arduino Ventuno Q: Linux SoC bit-bangs SWD to the on-board STM32H5 MCU.
# Taken from /opt/openocd/openocd_gpiod.cfg on the board (also used by arduino/remoteocd).
# Use: openocd -f board/arduino_ventuno_q.cfg

# BOOT0 (gpiochip2 line 47) must be low when the MCU leaves reset, otherwise it
# boots the ST ROM bootloader (DFU) and can't be halted. It floats after a Linux
# boot; the level persists once set. libgpiod v1 tools first, then v2.
if {[catch {exec gpioset -m exit 2 47=0}] && [catch {exec gpioset -c2 -t0 47=0}]} {
	echo "Warn : could not drive BOOT0 low (gpioset missing or no GPIO access)"
}

adapter driver linuxgpiod

adapter gpio srst 78 -chip 2
adapter gpio swclk 71 -chip 2
adapter gpio swdio 70 -chip 2
adapter gpio trst 78 -chip 2

transport select swd
source [find target/stm32h5x.cfg]

# linuxgpiod can't change the adapter speed, and the stock reset-start handler
# runs "adapter speed 480", which aborts every reset.
stm32h5x.cpu configure -event reset-start {}
