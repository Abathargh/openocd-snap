# Arduino Ventuno Q: Linux SoC bit-bangs SWD to the on-board STM32H5 MCU.
# Taken from /opt/openocd/openocd_gpiod.cfg on the board (also used by arduino/remoteocd).
# Use: openocd -f board/arduino_ventuno_q.cfg

adapter driver linuxgpiod

adapter gpio srst 78 -chip 2
adapter gpio swclk 71 -chip 2
adapter gpio swdio 70 -chip 2
adapter gpio trst 78 -chip 2

transport select swd
source [find target/stm32h5x.cfg]
